<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaStrip — Your photos. Untracked.</title>
  <meta name="description" content="Your photos leak your location, device, and timeline. See it, then strip it — 100% in your browser. No upload. No server. No account." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23fb4903'/><text x='50' y='68' font-size='52' font-family='Arial Black' font-weight='900' text-anchor='middle' fill='white'>M</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== NAV ===== -->
  <header class="nav">
    <a class="nav__logo" href="#top" aria-label="MetaStrip home">M</a>
    <nav class="nav__links" aria-label="Main">
      <a class="pill pill--nav" href="#app">CLEAN A PHOTO</a>
      <a class="pill pill--nav" href="#leaks">WHAT LEAKS</a>
      <a class="pill pill--nav" href="#faq">FAQ</a>
    </nav>
    <a class="pill pill--dark" href="https://github.com/rawsun007/metastrip" target="_blank" rel="noopener">GITHUB</a>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero" id="top">
    <span class="sticker sticker--pin" aria-hidden="true">📍</span>
    <span class="sticker sticker--cam" aria-hidden="true">📷</span>
    <span class="sticker sticker--sat" aria-hidden="true">🛰️</span>
    <h1 class="hero__title">METASTRIP</h1>
    <p class="hero__tagline">Your photos. Untracked.</p>
    <div class="hero__ctas">
      <a class="pill pill--light pill--big" href="#app">STRIP A PHOTO</a>
      <span class="pill pill--accent pill--big">100% ON-DEVICE. NOTHING UPLOADS.</span>
    </div>
  </section>

  <!-- ===== APP ===== -->
  <section class="app" id="app">
    <h2 class="section-title section-title--light">DROP IT.<br>SEE THE LEAK.</h2>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload photos to inspect and clean">
      <span class="dropzone__emoji" aria-hidden="true">🖼️</span>
      <p class="dropzone__text">Drag photos here — or click to choose</p>
      <p class="dropzone__hint">JPEG &amp; PNG · nothing ever uploads · works offline</p>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </div>
    <div class="results" id="results"></div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
